name: Build OpenWrt 21.02

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      set_target:
        description: "Select Target Device for LEDE."
        required: false
        default: "zte_e8820v2"
        type: choice
        options:
          - zte_e8820v2
          - phicomm_k2p

jobs:
  build_openwrt:

    name: Build OpenWrt Firmware

    runs-on: ubuntu-latest

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update

          # Safely purge commonly unwanted packages only if they are installed.
          # This avoids apt failing with exit code 100 when globs don't match anything.
          PKG_PATTERN='^(azure-cli|ghc|zulu|llvm|firefox|google|dotnet|powershell|openjdk|mysql|php|mongodb|snap)'
          PKGS_TO_PURGE=$(dpkg-query -W -f='${Package}\n' 2>/dev/null | grep -E "$PKG_PATTERN" || true)
          if [ -n "$PKGS_TO_PURGE" ]; then
            echo "Purging packages: $PKGS_TO_PURGE"
            sudo -E apt -y purge $PKGS_TO_PURGE
          else
            echo "No matching packages to purge"
          fi

          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev || true
          sudo -E apt -y install binutils bzip2 diffutils flex gawk grep libc-dev libz-dev make perl rsync subversion unzip || true
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Jakarta"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      
      - name: Checkout OpenWrt
        uses: actions/checkout@v3

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration file
        run: |
          make defconfig
          cp -rf ./productconfig/${{ inputs.set_target }}_defconfig .config
          

      - name: Download packages
        run: make download -j16

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/

      - name: Upload buildinfo
        uses: actions/upload-artifact@main
        with:
          name: OpenWrt_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload package
        uses: actions/upload-artifact@main
        with:
          name: OpenWrt_package
          path: ./artifact/package/

      - name: Upload firmware
        uses: actions/upload-artifact@main
        with:
          name: OpenWrt_firmware
          path: ./bin/targets/
