name: Build OpenWrt 23.05

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      set_target:
        description: "Select Target Device for LEDE."
        required: false
        default: "zte_e8820v2"
        type: choice
        options:
          - zte_e8820v2
          - phicomm_k2p

jobs:
  build_openwrt:
    name: Build OpenWrt Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Free up space first
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo apt-mark hold grub-efi-amd64-signed
          
          # Clean package lists and update
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt clean
          sudo apt update
          
          # Remove unnecessary packages first
          sudo apt -y purge azure-cli* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          
          # Update and upgrade system
          sudo apt -y upgrade
          
          # Install required packages in smaller groups
          sudo apt -y install ack antlr3 aria2 asciidoc autoconf automake autopoint
          sudo apt -y install binutils bison build-essential bzip2 ccache cmake cpio curl
          sudo apt -y install device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib
          sudo apt -y install git gperf haveged help2man intltool libc6-dev-i386 libelf-dev
          sudo apt -y install libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev
          sudo apt -y install libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev
          sudo apt -y install libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip-full
          sudo apt -y install patch pkgconf python3 python3-pip python3-ply python-docutils qemu-utils
          sudo apt -y install rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl
          sudo apt -y install unzip vim wget xmlto xxd zlib1g-dev
          
          # Set timezone
          sudo timedatectl set-timezone "Asia/Shanghai"
          
          # Clean up
          sudo apt -y autoremove --purge
          sudo apt clean

      - name: Checkout OpenWrt
        uses: actions/checkout@v3

      - name: Update feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration file
        run: |
          make defconfig
          cp -rf ./productconfig/${{ inputs.set_target }}_defconfig .config

      - name: Download packages
        run: make download -j16

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/

      - name: Upload buildinfo
        uses: actions/upload-artifact@v3
        with:
          name: OpenWrt_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload package
        uses: actions/upload-artifact@v3
        with:
          name: OpenWrt_package
          path: ./artifact/package/

      - name: Upload firmware
        uses: actions/upload-artifact@v3
        with:
          name: OpenWrt_firmware
          path: ./bin/targets/
